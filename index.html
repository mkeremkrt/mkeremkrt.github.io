<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustafa Kerem Kurt</title>
    <meta name="description" content="Code is my tool, Linux is my lab, and the world is my canvas.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap"

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="content-wrapper">
        <header class="hero">
            <h1 class="glow-text">Hello, I'm <span class="highlight">Mustafa Kerem Kurt</span>!</h1>
            <p class="bio glow-text-subtle">Code is my tool, Linux is my lab, and the world is my canvas.</p>
        </header>

        <main>
            <section id="terminal-container">
                <div class="terminal-window">
                    <div class="terminal-header">
                        <div class="terminal-buttons">
                            <span class="terminal-btn close"></span>
                            <span class="terminal-btn minimize"></span>
                            <span class="terminal-btn maximize"></span>
                        </div>
                        <div class="terminal-title">mkeremkurt@lab: ~</div>
                    </div>
                    <div class="terminal-body" id="terminal-body">
                        <div id="terminal-output"></div>
                        <div class="terminal-input-line">
                            <span class="prompt"><span id="prompt-user">mkeremkurt@lab</span>:<span id="prompt-path">~</span>$</span>
                            <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <footer>
            <div class="social-links">
                <a href="https://github.com/mkeremkrt" target="_blank" rel="noopener noreferrer" class="social-icon"

                <a href="https://www.linkedin.com/in/mustafa-kerem-kurt-404a4a392/" target="_blank"

                        class="fa-brands fa-linkedin"></i></a>
                <a href="https://medium.com/@mkeremkurt" target="_blank" rel="noopener noreferrer" class="social-icon"
                    title="Medium"><i class="fa-brands fa-medium"></i></a>
                <a href="mailto:mkeremkrt17@gmail.com" class="social-icon" title="Email"><i
                        class="fa-solid fa-envelope"></i></a>

        </footer>
